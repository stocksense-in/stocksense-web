name: Data pipeline

# Refreshes Supabase on weekdays. Needs repository secrets SUPABASE_URL and
# SUPABASE_SERVICE_KEY (Settings → Secrets and variables → Actions).
# Scheduled workflows only run from the default branch.
on:
  schedule:
    - cron: "30 11 * * 1-5" # weekdays 17:00 IST, after market close: prices + fundamentals
    - cron: "30 4 * * 0"    # Sundays 10:00 IST: ownership + revenue growth (slow)
  workflow_dispatch:
    inputs:
      job:
        description: "Job to run"
        default: "fundamentals"
        type: choice
        options: [fundamentals, ownership, prices]

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: backend
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Check secrets
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_KEY" ]; then
            echo "::error::Add SUPABASE_URL and SUPABASE_SERVICE_KEY as repository secrets."
            exit 1
          fi
      - name: Prices
        if: github.event.schedule == '30 11 * * 1-5' || inputs.job == 'prices'
        run: python -m stocksense prices
      - name: Fundamentals
        if: github.event.schedule == '30 11 * * 1-5' || inputs.job == 'fundamentals'
        run: python -m stocksense fundamentals
      - name: Ownership
        if: github.event.schedule == '30 4 * * 0' || inputs.job == 'ownership'
        run: python -m stocksense ownership
