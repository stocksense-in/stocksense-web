name: Data pipeline

# Refreshes Supabase on weekdays. Needs repository secrets SUPABASE_URL and
# SUPABASE_SERVICE_KEY (Settings → Secrets and variables → Actions).
# Until they're added, scheduled runs skip with a warning instead of failing.
# Scheduled workflows only run from the default branch.
on:
  schedule:
    - cron: "30 11 * * 1-5" # weekdays 17:00 IST, after market close: prices + fundamentals
    - cron: "30 4 * * 0"    # Sundays 10:00 IST: ownership + revenue growth (slow)
  workflow_dispatch:
    inputs:
      job:
        description: "Job to run"
        default: "fundamentals"
        type: choice
        options: [fundamentals, ownership, prices]

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: backend
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      CONFIGURED: ${{ secrets.SUPABASE_URL != '' && secrets.SUPABASE_SERVICE_KEY != '' }}
    steps:
      - name: Secrets not set
        if: env.CONFIGURED != 'true'
        working-directory: .
        run: |
          msg="Add SUPABASE_URL and SUPABASE_SERVICE_KEY as repository secrets to enable the data pipeline."
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "::error::$msg"; exit 1   # a manual run was meant to work
          fi
          echo "::warning::$msg Skipping this scheduled run."
      - uses: actions/checkout@v4
        if: env.CONFIGURED == 'true'
      - uses: actions/setup-python@v5
        if: env.CONFIGURED == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install
        if: env.CONFIGURED == 'true'
        run: pip install -r requirements.txt
      - name: Prices
        if: env.CONFIGURED == 'true' && (github.event.schedule == '30 11 * * 1-5' || inputs.job == 'prices')
        run: python -m stocksense prices
      - name: Fundamentals
        if: env.CONFIGURED == 'true' && (github.event.schedule == '30 11 * * 1-5' || inputs.job == 'fundamentals')
        run: python -m stocksense fundamentals
      - name: Ownership
        if: env.CONFIGURED == 'true' && (github.event.schedule == '30 4 * * 0' || inputs.job == 'ownership')
        run: python -m stocksense ownership
